<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=http://localhost:4173/" />
    <title>開啟文獻管理代理人本機版</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        max-width: 560px;
        padding: 28px;
        border-radius: 22px;
        background: color-mix(in srgb, Canvas 90%, transparent);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.12);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }

      p {
        line-height: 1.7;
        margin: 0 0 16px;
      }

      a {
        color: #0071e3;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>正在開啟本機版</h1>
      <p>如果沒有自動開啟，請先雙擊同一個資料夾裡的「啟動-Mac.command」或「啟動-Windows.bat」，再點下方連結。</p>
      <p><a href="http://localhost:4173/">開啟 http://localhost:4173/</a></p>
    </main>
  </body>
</html>
